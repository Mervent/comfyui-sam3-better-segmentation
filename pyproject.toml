[project]
name = "comfyui-sam3-better-segmentation"
description = "ComfyUI custom nodes for Meta SAM3 image segmentation with text prompts, point/box guidance, and Impact Pack SEGS output."
version = "1.0.0"
license = {file = "LICENSE.txt"}
requires-python = ">=3.10"

dependencies = [
    "huggingface_hub>=0.34.0,<1.0",
    "opencv-python>=4.8.0",
    "timm>=1.0.17",
    "decord>=0.6.0",
    "av>=9.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "einops>=0.6.0",
    "pycocotools>=2.0.6",
    "shapely>=1.8.0",
    "ftfy>=6.1.1",
    "regex",
    "iopath>=0.1.10",
    "typing_extensions",
    "numpy>=1.26,<1.28",
    "tqdm>=4.65.0",
    "transformers>=4.40.0,<5.0.0",
]

[project.urls]
Repository = "https://github.com/nicholaschenai/comfyui-sam3-better-segmentation"

[tool.comfy]
PublisherId = "sam3bs"
DisplayName = "ComfyUI SAM3 Better Segmentation"
